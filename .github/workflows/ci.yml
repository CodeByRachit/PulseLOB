name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "gcc-13 release", os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, preset: release }
          - { name: "clang-18 asan+ubsan", os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, preset: asan }
          - { name: "clang-18 tsan", os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, preset: tsan }
          # macos-latest tracks GitHub's supported Apple Silicon image (macos-14 has been retired).
          - { name: "appleclang arm64 release", os: macos-latest, cc: clang, cxx: clang++, preset: release }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Allow ThreadSanitizer on high-entropy ASLR kernels
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --preset ${{ matrix.preset }} -DPULSELOB_WARNINGS_AS_ERRORS=ON
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - run: ctest --preset ${{ matrix.preset }}

  bench-build:
    name: Benchmarks compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset bench -DPULSELOB_WARNINGS_AS_ERRORS=ON
      - run: cmake --build --preset bench --parallel 4

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[test]"
      - run: python -m pytest -q

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format==18.1.8
      - run: git ls-files -- '*.hpp' '*.cpp' '*.hpp.in' | xargs clang-format --dry-run --Werror

  layering:
    name: Include layering
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_layering.py

  docs-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes markdownlint-cli2@0.14.0

  links:
    name: Relative link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments --exclude-path build --exclude-path .venv './**/*.md'
          fail: true

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_version.sh

  math-validation:
    name: Math spec validation (quick)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - run: python research/phase1/validate_math_spec.py

  reference-fixture:
    name: Reference fixture reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      # Regenerates tests/fixtures/phase3_crosscheck.txt from the definition-level reference and
      # compares it with the committed file (the C++ cross-check test reads the committed file).
      - run: python research/phase3/crosscheck_reference.py --check
