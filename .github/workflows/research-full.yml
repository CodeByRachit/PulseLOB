name: Research experiments (full)

# Reruns the estimator-comparison experiments quoted in docs/math_spec.md Section 5.8.
# Slower than CI, so it runs weekly and on demand rather than on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - run: python research/phase1/validate_math_spec.py --full | tee validation_full.txt
      - uses: actions/upload-artifact@v4
        with:
          name: validation-full
          path: validation_full.txt
