name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION and CHANGELOG
        run: bash scripts/check_version.sh "${GITHUB_REF_NAME}"
      - name: Render release title and notes from CHANGELOG
        run: |
          python3 scripts/release_notes.py "${GITHUB_REF_NAME}" > release_notes.md
          python3 scripts/release_notes.py "${GITHUB_REF_NAME}" --title > release_title.txt
          test -s release_notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Phase releases are regular releases (the newest is marked Latest); only tags with a
          # suffix such as v0.5.0-rc1 are pre-releases.
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "$(cat release_title.txt)" \
            --notes-file release_notes.md --verify-tag $prerelease
