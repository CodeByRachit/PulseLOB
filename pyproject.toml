[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13.6,<3"]
build-backend = "scikit_build_core.build"

[project]
name = "pulselob"
dynamic = ["version"]
description = "Online cross-venue order-flow toxicity detection with marked Hawkes processes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
test = ["pytest>=7"]
research = ["scipy>=1.10", "mpmath>=1.3"]

[project.urls]
Repository = "https://github.com/CodeByRachit/PulseLOB"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.25"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/pulselob"]
sdist.exclude = ["build", "research", ".github"]

[tool.scikit-build.cmake.define]
PULSELOB_BUILD_PYTHON = "ON"
PULSELOB_BUILD_TESTS = "OFF"
PULSELOB_BUILD_BENCHMARKS = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '(?P<value>\d+\.\d+\.\d+(?:[-+.][0-9A-Za-z.]+)?)'

[tool.pytest.ini_options]
testpaths = ["tests/python"]
